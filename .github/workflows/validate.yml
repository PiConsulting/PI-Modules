###############################################################################
# Pipeline de validación del repositorio de módulos.
#
# Todos los controles ejecutados en este pipeline son de análisis estático
# o validación (plan-only). No se realizan despliegues (terraform apply).
#
# Etapas:
#   fmt       - Verifica el formato del código.
#   discover  - Detecta los módulos disponibles y genera la matriz de ejecución.
#               En pull_request valida solo los módulos con cambios (o todos si el
#               cambio toca configuración compartida del pipeline). En push a main
#               y workflow_dispatch valida siempre el catálogo completo.
#   validate  - Ejecuta init, validate y terraform test sobre los módulos y sus ejemplos.
#   tflint    - Analiza buenas prácticas y reglas específicas del proveedor AWS.
#   docs      - Verifica que la documentación esté sincronizada con variables.tf.
#   checkov   - Ejecuta controles de seguridad sobre la configuración HCL.
###############################################################################

name: validate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  TFDOCS_VERSION: "v0.19.0"
  TF_IN_AUTOMATION: "true"

  # Credenciales simuladas.
  # Ningún job realiza llamadas reales a AWS.
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "mock"
  AWS_SECRET_ACCESS_KEY: "mock"

jobs:
  # Terraform Format

  fmt:
    name: fmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

  # Discover Modules
  discover:
    name: Discover Modules
    runs-on: ubuntu-latest

    outputs:
      modules: ${{ steps.list.outputs.modules }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: se necesita para diffear contra el base sha del PR.
          fetch-depth: 0

      - name: Discover modules/*
        id: list
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_modules=$(
            find modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
            | sort
          )

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

            echo "::group::Archivos modificados"
            echo "$changed"
            echo "::endgroup::"

            # Cambios en config compartida del pipeline: se valida el catálogo completo.
            shared_changed=$(
              echo "$changed" \
                | grep -E '^(\.github/workflows/|\.tflint\.hcl$|\.terraform-docs\.yml$)' \
                || true
            )

            if [ -n "$shared_changed" ]; then
              echo "Cambios en configuración compartida del pipeline: se valida todo el catálogo."
              modules="$all_modules"
            else
              modules=$(echo "$changed" | grep -E '^modules/[^/]+/' | cut -d/ -f1-2 | sort -u)
            fi
          else
            # push a main / workflow_dispatch: catálogo completo, sin excepciones.
            modules="$all_modules"
          fi

          modules_json=$(echo "$modules" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "modules=$modules_json" >> "$GITHUB_OUTPUT"
          echo "Detected modules: $modules_json"

  # Validate Modules
  validate:
    name: validate · ${{ matrix.module }}

    needs: discover
    runs-on: ubuntu-latest

    env:
      # Cada módulo se valida a sí mismo y a examples/minimal + examples/complete:
      # 3 "terraform init" por módulo. Sin esto, cada uno redescarga el provider aws.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache

    strategy:
      fail-fast: false

      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # No hay .terraform.lock.hcl versionado (es un repo de módulos, ver .gitignore):
          # se invalida por los rangos de version en versions.tf en su lugar.
          key: tf-providers-${{ runner.os }}-${{ env.TF_VERSION }}-${{ hashFiles('modules/**/versions.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-${{ env.TF_VERSION }}-

      - name: Prepare Terraform Plugin Cache Dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # Module Validation
      - name: Terraform Init & Validate
        working-directory: ${{ matrix.module }}
        run: |
          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # Examples Validation
      # Regla del repositorio: todo módulo debe incluir examples/minimal y
      # examples/complete (no basta con que exista "algo" en examples/).
      - name: Validate Examples
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail

          missing=""

          for name in minimal complete; do
            dir="$MODULE/examples/$name"

            if [ ! -d "$dir" ]; then
              missing="$missing $name"
              continue
            fi

            echo "::group::$dir"

            terraform -chdir="$dir" init \
              -backend=false \
              -input=false

            terraform -chdir="$dir" validate

            echo "::endgroup::"
          done

          if [ -n "$missing" ]; then
            echo "::error::$MODULE no tiene:$missing en examples/. Todo módulo debe incluir examples/minimal y examples/complete."
            exit 1
          fi

      # Terraform Tests
      - name: Terraform Test
        working-directory: ${{ matrix.module }}
        run: |
          if [ -d tests ]; then
            terraform test
          else
            echo "::error::${{ matrix.module }} no tiene tests/."
            exit 1
          fi

  # TFLint
  tflint:
    name: tflint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Initialize TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: Run TFLint
        run: |
          tflint \
            --recursive \
            --config="$(pwd)/.tflint.hcl" \
            --format=compact

  # Terraform Docs
  # No bloqueante: dio falsos positivos/fallos cosméticos en la primera ejecución.
  # Vuelve a ser bloqueante cuando lleve un par de módulos limpios.
  docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        shell: bash
        run: |
          set -euo pipefail

          url="https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"

          curl -sSLo /tmp/tfdocs.tar.gz "$url"

          tar -xzf /tmp/tfdocs.tar.gz \
            -C /tmp \
            terraform-docs

          sudo install \
            -m 0755 \
            /tmp/terraform-docs \
            /usr/local/bin/terraform-docs

      - name: Validate READMEs
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          for module in modules/*/; do
            echo "::group::$module"

            terraform-docs \
              -c .terraform-docs.yml \
              --output-check \
              "$module" || fail=1

            echo "::endgroup::"
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::README desactualizado."
            echo "::error::Ejecuta terraform-docs -c .terraform-docs.yml modules/<nombre>"
            exit 1
          fi
  # Checkov
  # No bloqueante: dio falsos positivos/fallos cosméticos en la primera ejecución.
  # Vuelve a ser bloqueante cuando lleve un par de módulos limpios.
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install --quiet checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory modules \
            --framework terraform \
            --download-external-modules false \
            --compact \
            --quiet
